image:
  registry: ghcr.io
  repository: excavador/homebox-mcp
  # Empty means the chart's appVersion. Pin it in a values file to upgrade
  # deliberately rather than whenever the chart is republished.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

homebox:
  # Base URL WITHOUT /api — the server appends /api/v1 itself.
  url: ""
  # Required. The token is never a literal in values: it would end up in a
  # values file, in git, and in `helm get values` output.
  existingSecret: ""
  existingSecretTokenKey: token
  # Deadline for an ordinary request to HomeBox, body included (a Go
  # duration). A streamed upload is bound by upload.timeout instead.
  timeout: 30s

# stdio is meaningless in a pod, so this chart only ever runs http.
service:
  type: ClusterIP
  port: 8080

# The server validates every request itself against access-roster: no
# secret to provide here, because a bearer token is never a literal and a
# CIMD client never registers one. Both are required -- there is no
# gateway fallback any more.
auth:
  # access-roster's own URL, exactly as it appears in a token's `iss`.
  issuerUrl: ""
  # This server's own EXTERNAL URL (not its in-cluster Service address):
  # the RFC 8707 resource indicator a client names, and the audience
  # access-roster mints a token for. Must match, byte for byte, this
  # resource's id in access-roster's own policy.
  resourceUrl: ""
  # Advertised in the PRM's scopes_supported and the 401 challenge's
  # scope -- never checked by this server itself. access-roster refuses
  # an authorize request with no scope at all; "openid" is the one it
  # accepts by default. An estate needing more sets this, not the image.
  scope: openid

# homebox_prepare_attachment_upload: one-time links a caller PUTs a local file
# to. The file is streamed to HomeBox, so memory does not grow with its size.
upload:
  # Largest file a link accepts, in bytes. HomeBox has its own limit
  # (HBOX_WEB_MAX_UPLOAD_SIZE, in MiB, default 10): raise both together, or the
  # refusal just moves to HomeBox. Default is HomeBox's own 10 MiB.
  maxBytes: 10485760
  # How long a link stays valid (a Go duration, 1m to 24h).
  ttl: 10m
  # How long one whole upload may take, receiving and storing it (10s to 6h).
  # A hundred megabytes over a slow uplink takes minutes.
  timeout: 15m

resources:
  requests: {cpu: 20m, memory: 64Mi}
  limits: {memory: 128Mi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: ["ALL"]}

# Annotations on the DEPLOYMENT, not the pod template. Reloader reads them
# here: an annotation on the pod template looks right and is never seen, so a
# rotated token would sit in a Secret while the pod kept the old one.
deploymentAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
