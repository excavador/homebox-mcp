{{- include "homebox-mcp.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homebox-mcp.fullname" . }}
  labels: {{- include "homebox-mcp.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "homebox-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "homebox-mcp.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: homebox-mcp
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: HOMEBOX_URL
              value: {{ .Values.homebox.url | quote }}
            - name: HOMEBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.homebox.existingSecret }}
                  key: {{ .Values.homebox.existingSecretTokenKey }}
            # stdio would exit immediately in a pod with no attached client.
            - name: TRANSPORT
              value: http
            - name: ADDR
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: ISSUER_URL
              value: {{ .Values.auth.issuerUrl | quote }}
            - name: RESOURCE_URL
              value: {{ .Values.auth.resourceUrl | quote }}
            - name: SCOPE
              value: {{ .Values.auth.scope | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # /healthz is liveness only and does NOT call HomeBox: a readiness
          # probe that fails when a dependency blips would take the pod out
          # of service for something it cannot fix by restarting.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
